<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="The Tower — high-rise residences">
  <defs>
    <linearGradient id="tw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12263A"/><stop offset="1" stop-color="#0B1826"/>
    </linearGradient>
    <linearGradient id="tw-face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B3552"/><stop offset="1" stop-color="#0E1F33"/>
    </linearGradient>
    <clipPath id="tw-clip"><rect width="1000" height="750"/></clipPath>
  </defs>
  <g clip-path="url(#tw-clip)">
    <rect width="1000" height="750" fill="url(#tw-sky)"/>
    <g stroke="#C08A2E" stroke-opacity=".16" stroke-width="1">
      <path d="M0 120h1000M0 240h1000M0 360h1000M0 480h1000"/>
    </g>

    <!-- back slab -->
    <rect x="600" y="200" width="180" height="400" fill="#0E1F33" stroke="#C08A2E" stroke-opacity=".25"/>
    <g fill="#C08A2E" opacity=".18">
      <rect x="620" y="230" width="140" height="10"/><rect x="620" y="280" width="140" height="10"/>
      <rect x="620" y="330" width="140" height="10"/><rect x="620" y="380" width="140" height="10"/>
      <rect x="620" y="430" width="140" height="10"/><rect x="620" y="480" width="140" height="10"/>
    </g>

    <!-- main tower -->
    <rect x="300" y="90" width="260" height="510" fill="url(#tw-face)" stroke="#C08A2E" stroke-opacity=".5"/>
    <g fill="#C08A2E" opacity=".55">
      <rect x="300" y="140" width="260" height="6"/><rect x="300" y="200" width="260" height="6"/>
      <rect x="300" y="260" width="260" height="6"/><rect x="300" y="320" width="260" height="6"/>
      <rect x="300" y="380" width="260" height="6"/><rect x="300" y="440" width="260" height="6"/>
      <rect x="300" y="500" width="260" height="6"/>
    </g>
    <g fill="#F7F4EE" opacity=".14">
      <rect x="322" y="152" width="60" height="42"/><rect x="400" y="152" width="60" height="42"/><rect x="478" y="152" width="60" height="42"/>
      <rect x="322" y="272" width="60" height="42"/><rect x="400" y="272" width="60" height="42"/><rect x="478" y="272" width="60" height="42"/>
      <rect x="322" y="392" width="60" height="42"/><rect x="400" y="392" width="60" height="42"/><rect x="478" y="392" width="60" height="42"/>
    </g>
    <g fill="#C08A2E" opacity=".38">
      <rect x="322" y="212" width="60" height="42"/><rect x="478" y="212" width="60" height="42"/>
      <rect x="400" y="332" width="60" height="42"/>
      <rect x="322" y="452" width="60" height="42"/><rect x="478" y="452" width="60" height="42"/>
    </g>
    <!-- crown -->
    <rect x="330" y="60" width="200" height="30" fill="#C08A2E" opacity=".8"/>
    <rect x="424" y="16" width="12" height="44" fill="#C08A2E"/>

    <!-- podium arcade — echo of the mark -->
    <rect x="200" y="480" width="120" height="120" fill="#0E1F33" stroke="#C08A2E" stroke-opacity=".3"/>
    <g fill="none" stroke="#C08A2E" stroke-width="2.5" stroke-opacity=".7">
      <path d="M225 600v-58a20 20 0 0 1 40 0v58"/>
      <path d="M280 600v-58a15 15 0 0 1 30 0v58"/>
    </g>

    <rect x="40" y="600" width="920" height="8" rx="4" fill="#C08A2E"/>
    <rect x="0" y="608" width="1000" height="142" fill="#0B1826"/>
  </g>
</svg>
