<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="The Skyline — mixed-use district at dusk">
  <defs>
    <linearGradient id="sk-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1826"/><stop offset=".55" stop-color="#12263A"/><stop offset="1" stop-color="#20406A"/>
    </linearGradient>
    <linearGradient id="sk-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C08A2E" stop-opacity=".55"/><stop offset="1" stop-color="#C08A2E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sk-clip"><rect width="1000" height="750"/></clipPath>
  </defs>
  <g clip-path="url(#sk-clip)">
    <rect width="1000" height="750" fill="url(#sk-sky)"/>
    <ellipse cx="500" cy="620" rx="420" ry="300" fill="url(#sk-sun)"/>
    <circle cx="500" cy="560" r="70" fill="#C08A2E" opacity=".45"/>

    <!-- far skyline -->
    <g fill="#0E1F33" opacity=".9">
      <rect x="20" y="380" width="70" height="240"/><rect x="105" y="330" width="55" height="290"/>
      <rect x="175" y="410" width="80" height="210"/><rect x="270" y="290" width="60" height="330"/>
      <rect x="700" y="345" width="65" height="275"/><rect x="780" y="400" width="80" height="220"/>
      <rect x="875" y="320" width="60" height="300"/><rect x="945" y="420" width="55" height="200"/>
    </g>

    <!-- mid towers -->
    <g fill="#12263A" stroke="#C08A2E" stroke-opacity=".35">
      <rect x="345" y="250" width="90" height="370"/>
      <rect x="565" y="220" width="95" height="400"/>
      <rect x="455" y="300" width="100" height="320"/>
    </g>
    <g fill="#C08A2E" opacity=".5">
      <rect x="345" y="300" width="90" height="4"/><rect x="345" y="360" width="90" height="4"/>
      <rect x="345" y="420" width="90" height="4"/><rect x="345" y="480" width="90" height="4"/>
      <rect x="565" y="270" width="95" height="4"/><rect x="565" y="330" width="95" height="4"/>
      <rect x="565" y="390" width="95" height="4"/><rect x="565" y="450" width="95" height="4"/>
      <rect x="455" y="350" width="100" height="4"/><rect x="455" y="410" width="100" height="4"/>
      <rect x="455" y="470" width="100" height="4"/>
    </g>
    <g fill="#F7F4EE" opacity=".16">
      <rect x="360" y="312" width="26" height="34"/><rect x="396" y="312" width="26" height="34"/>
      <rect x="360" y="432" width="26" height="34"/><rect x="396" y="432" width="26" height="34"/>
      <rect x="580" y="282" width="28" height="34"/><rect x="618" y="282" width="28" height="34"/>
      <rect x="580" y="402" width="28" height="34"/><rect x="618" y="402" width="28" height="34"/>
      <rect x="470" y="362" width="30" height="34"/><rect x="512" y="362" width="30" height="34"/>
    </g>

    <!-- foreground arcade -->
    <rect x="0" y="560" width="1000" height="60" fill="#0B1826"/>
    <g fill="none" stroke="#C08A2E" stroke-width="3" stroke-opacity=".9">
      <path d="M60 620v-32a24 24 0 0 1 48 0v32"/><path d="M150 620v-32a24 24 0 0 1 48 0v32"/>
      <path d="M240 620v-32a24 24 0 0 1 48 0v32"/><path d="M712 620v-32a24 24 0 0 1 48 0v32"/>
      <path d="M802 620v-32a24 24 0 0 1 48 0v32"/><path d="M892 620v-32a24 24 0 0 1 48 0v32"/>
    </g>

    <rect x="0" y="620" width="1000" height="8" fill="#C08A2E"/>
    <rect x="0" y="628" width="1000" height="122" fill="#0B1826"/>
  </g>
</svg>
